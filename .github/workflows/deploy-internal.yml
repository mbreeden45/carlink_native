name: Deploy to Play internal

# Every push to main: run unit tests, build a signed release AAB, and publish it to the Google Play
# INTERNAL track for com.myequinox.myapp.
#
# Required repository secrets:
#   PLAY_STORE_JSON_KEY  service account JSON (github-actions-uploader@play-deploy-auto...), with
#                        "Release to testing tracks" permission on the app in Play Console
#   CARLINK_KEYSTORE_BASE64  base64 of the upload keystore (base64 -w0 upload.jks)
#   CARLINK_STORE_PASSWORD, CARLINK_KEY_ALIAS, CARLINK_KEY_PASSWORD
# (same keystore secrets release.yml uses)
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two uploads at once; never cancel one mid-upload either.
concurrency:
  group: deploy-internal
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.myequinox.myapp
  # versionCode = VERSION_CODE_BASE + this workflow's run number. GITHUB_RUN_NUMBER is per-workflow and
  # starts at 1, so app/build.gradle.kts's default (+100) would make this workflow's first build 101,
  # colliding with codes Play has already seen. 1000 keeps every build strictly above 102 and above
  # anything build.yml / release.yml (+100) can reach.
  VERSION_CODE_BASE: 1000

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Check secrets are present
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
          CARLINK_KEYSTORE_BASE64: ${{ secrets.CARLINK_KEYSTORE_BASE64 }}
          CARLINK_STORE_PASSWORD: ${{ secrets.CARLINK_STORE_PASSWORD }}
          CARLINK_KEY_ALIAS: ${{ secrets.CARLINK_KEY_ALIAS }}
          CARLINK_KEY_PASSWORD: ${{ secrets.CARLINK_KEY_PASSWORD }}
        run: |
          missing=0
          for name in PLAY_STORE_JSON_KEY CARLINK_KEYSTORE_BASE64 CARLINK_STORE_PASSWORD CARLINK_KEY_ALIAS CARLINK_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set"; missing=1; fi
          done
          # Without a keystore Gradle silently builds an UNSIGNED bundle, which Play rejects.
          exit $missing

      - name: Compute versionCode
        id: version
        run: |
          code=$(( VERSION_CODE_BASE + GITHUB_RUN_NUMBER ))
          if [ "$code" -le 102 ]; then echo "::error::versionCode $code must be > 102"; exit 1; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "versionCode = $code"

      - name: Decode keystore
        env:
          CARLINK_KEYSTORE_BASE64: ${{ secrets.CARLINK_KEYSTORE_BASE64 }}
        run: echo "$CARLINK_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build signed release bundle
        env:
          # Names app/build.gradle.kts reads for release signing.
          CARLINK_STORE_FILE: ${{ runner.temp }}/upload.jks
          CARLINK_STORE_PASSWORD: ${{ secrets.CARLINK_STORE_PASSWORD }}
          CARLINK_KEY_ALIAS: ${{ secrets.CARLINK_KEY_ALIAS }}
          CARLINK_KEY_PASSWORD: ${{ secrets.CARLINK_KEY_PASSWORD }}
          # Optional: adapter web-config signing secret (enables the Wi-Fi USB-mode kick).
          CARLINK_BOX_SECRET: ${{ secrets.CARLINK_BOX_SECRET }}
          # Optional: adapter Wi-Fi password (enables the app joining the adapter's Wi-Fi itself).
          CARLINK_BOX_WIFI_PSK: ${{ secrets.CARLINK_BOX_WIFI_PSK }}
        run: |
          if [ -z "$CARLINK_BOX_SECRET" ]; then echo "::warning::CARLINK_BOX_SECRET not set - Wi-Fi adapter kick disabled in this build"; fi
          if [ -z "$CARLINK_BOX_WIFI_PSK" ]; then echo "::warning::CARLINK_BOX_WIFI_PSK not set - app will not join the adapter's Wi-Fi by itself"; fi
          ./gradlew --no-daemon bundleRelease -Pcarlink.versionCode=${{ steps.version.outputs.code }}

      - name: Verify bundle is signed
        run: |
          aab=$(ls app/build/outputs/bundle/release/*.aab)
          echo "Bundle: $aab"
          jarsigner -verify "$aab" | tee /dev/stderr | grep -q "jar verified"

      - name: Upload to Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carlink-release-aab-${{ steps.version.outputs.code }}
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
